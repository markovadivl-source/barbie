<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Онлайн-запись</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary: #ff6b81;
      --primary-hover: #ff4757;
      --bg: #ffffff;
      --text: #222222;
      --hint: #888888;
      --card-bg: #f7f7f7;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0; padding: 16px;
      touch-action: manipulation;
    }
    h3 { margin-top: 4px; font-size: 19px; text-align: center; }
    .section-title { font-weight: 600; font-size: 13px; margin: 16px 0 8px; color: var(--hint); text-transform: uppercase; }
    .chips-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .chip {
      padding: 10px 14px; border-radius: 10px; border: 1px solid #e0e0e0;
      background: var(--card-bg); color: var(--text); font-size: 14px; font-weight: 500;
      cursor: pointer; user-select: none;
    }
    .chip.selected {
      background: var(--primary) !important;
      color: #ffffff !important;
      border-color: var(--primary) !important;
    }
    input {
      width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 10px;
      border: 1px solid #e0e0e0; font-size: 15px; margin-bottom: 20px;
      background: var(--card-bg); color: var(--text); outline: none;
    }
    .btn-submit {
      width: 100%; padding: 15px; border: none; border-radius: 12px;
      background: var(--primary); color: #ffffff;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .loader { text-align: center; padding: 15px; color: var(--hint); font-size: 14px; }
  </style>
</head>
<body>

  <h3>🌸 Онлайн-запись</h3>

  <div class="section-title">1. Выберите дату</div>
  <div id="loader" class="loader">Загрузка свободных окошек...</div>
  <div class="chips-grid" id="dates-container"></div>
  <div id="empty-view" style="display: none; text-align: center; color: var(--hint); padding: 15px 0;">Пока нет свободных слотов.</div>

  <div class="section-title">2. Выберите время</div>
  <div class="chips-grid" id="times-container">
    <span style="font-size: 13px; color: var(--hint);">Сначала выберите дату выше 👆</span>
  </div>

  <div class="section-title">3. Процедура</div>
  <div class="chips-grid" id="services-container">
    <div class="chip" data-srv="manicure">Маникюр (2.5ч)</div>
    <div class="chip" data-srv="pedicure">Педикюр (1.5ч)</div>
    <div class="chip" data-srv="extension">Наращивание (3.5ч)</div>
    <div class="chip" data-srv="complex">Маникюр + Педикюр (4ч)</div>
  </div>

  <div class="section-title">4. Ваше имя</div>
  <input type="text" id="client-name" placeholder="Как вас зовут?">

  <button class="btn-submit" id="submit-booking">Записаться ✨</button>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        const u = tg.initDataUnsafe.user;
        document.getElementById('client-name').value = [u.first_name, u.last_name].filter(Boolean).join(' ');
      }
    }

    let allSlots = [];
    let selectedSlotId = null;
    let selectedService = null;

    async function loadSlots() {
      try {
        const res = await fetch('/api/slots');
        allSlots = await res.json();
        document.getElementById('loader').style.display = 'none';

        if (!allSlots.length) {
          document.getElementById('empty-view').style.display = 'block';
          return;
        }

        const datesContainer = document.getElementById('dates-container');
        const uniqueDates = [...new Set(allSlots.map(s => s.date))];

        uniqueDates.forEach(d => {
          const btn = document.createElement('div');
          btn.className = 'chip';
          btn.innerText = `🗓 ${d}`;
          btn.onclick = () => {
            document.querySelectorAll('#dates-container .chip').forEach(c => c.classList.remove('selected'));
            btn.classList.add('selected');
            renderTimes(d);
          };
          datesContainer.appendChild(btn);
        });
      } catch (err) {
        document.getElementById('loader').innerText = 'Ошибка загрузки слотов';
      }
    }

    function renderTimes(date) {
      const timesContainer = document.getElementById('times-container');
      timesContainer.innerHTML = '';
      selectedSlotId = null;

      const daySlots = allSlots.filter(s => s.date === date);
      daySlots.forEach(s => {
        const btn = document.createElement('div');
        btn.className = 'chip';
        btn.innerText = `⏰ ${s.time}`;
        btn.onclick = () => {
          document.querySelectorAll('#times-container .chip').forEach(c => c.classList.remove('selected'));
          btn.classList.add('selected');
          selectedSlotId = s.id;
        };
        timesContainer.appendChild(btn);
      });
    }

    document.querySelectorAll('#services-container .chip').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#services-container .chip').forEach(c => c.classList.remove('selected'));
        btn.classList.add('selected');
        selectedService = btn.getAttribute('data-srv');
      };
    });

    document.getElementById('submit-booking').onclick = async () => {
      const name = document.getElementById('client-name').value.trim();
      if (!selectedSlotId || !selectedService || !name) {
        alert("Пожалуйста, укажите дату, время, процедуру и ваше имя!");
        return;
      }

      const payload = {
        slot_id: selectedSlotId,
        service_key: selectedService,
        name: name,
        tg_user_id: tg?.initDataUnsafe?.user?.id || null,
        tg_username: tg?.initDataUnsafe?.user?.username ? `@${tg.initDataUnsafe.user.username}` : "Без @тега"
      };

      try {
        const res = await fetch('/api/book', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert(`Вы успешно записаны! 🌸\nЖду вас ${result.date} в ${result.time}\nАдрес: ${result.address}`);
          if (tg) tg.close();
        } else {
          alert(result.message || "Это время уже занято.");
        }
      } catch (err) {
        alert("Ошибка при отправке данных. Попробуйте еще раз.");
      }
    };

    loadSlots();
  </script>
</body>
</html>
